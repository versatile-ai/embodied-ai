<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Astra · 双臂仿真</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111518;color:#e5e9ec;font:15px system-ui}main{max-width:1240px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:23px;margin:0}small{color:#99a8b2}#status{padding:12px 0;color:#b2d8c1}figure{margin:0}figcaption{padding:8px 0;color:#aebcc5}img{width:100%;display:block;background:#20272c;aspect-ratio:4/3;object-fit:contain}.views{display:grid;grid-template-columns:2fr 1fr;gap:20px}.wrists{display:grid;gap:12px}button{background:#293a44;color:white;border:1px solid #536772;border-radius:5px;padding:8px 14px;cursor:pointer}#detail{margin-top:18px;color:#99a8b2;line-height:1.8}@media(max-width:700px){.views{grid-template-columns:1fr}.wrists{grid-template-columns:1fr 1fr}}</style>
<main><header><div><h1>Astra · 双臂仿真</h1><small>MuJoCo · 独立测试环境</small></div><button id="refresh">刷新画面</button></header><div id="status">连接仿真服务…</div><div class="views"><figure><img id="cam_base" alt="主相机"><figcaption>主相机 · 桌面与垃圾桶</figcaption></figure><div class="wrists"><figure><img id="left_cam_wrist" alt="左腕相机"><figcaption>左腕相机</figcaption></figure><figure><img id="right_cam_wrist" alt="右腕相机"><figcaption>右腕相机</figcaption></figure></div></div><p id="detail"></p></main>
<script>let busy=false;async function tick(){if(busy)return;busy=true;try{let r=await fetch('/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);let s=await r.json();if(!s.session_id){document.querySelector('#status').textContent='服务已连接 · 等待创建测试场景';return}document.querySelector('#status').textContent=`${s.done?'已结束':'等待下一条动作'} · 控制步 ${s.t} · 分数 ${s.score} · 入桶 ${s.bottles_in} · ${s.success?'成功':'尚未成功'}`;document.querySelector('#detail').textContent=`任务：${s.instruction}　会话：${s.session_id}。画面随真实仿真控制步更新；等待策略决策时保持静止。`;for(let c of ['cam_base','left_cam_wrist','right_cam_wrist'])document.getElementById(c).src=`/frame/${s.session_id}/${c}?t=${s.t}`;}catch(e){document.querySelector('#status').textContent='服务暂不可达，正在重连…'}finally{busy=false}}document.querySelector('#refresh').onclick=tick;setInterval(tick,1000);tick();</script></html>
